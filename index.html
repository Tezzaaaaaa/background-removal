<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>Background Removal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">IMAGE TOOL</p>
      <h1>Remove the background.</h1>
      <p class="lede">Clean cutouts, processed locally by your own background-removal engine.</p>
    </header>

    <section class="workspace" aria-label="Background removal tool">
      <label class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp">
        <span class="upload-icon" aria-hidden="true">↑</span>
        <strong>Choose an image</strong>
        <span>or drag and drop</span>
        <small>JPG, PNG or WebP · up to 22 MB</small>
      </label>

      <section class="preview" id="preview" hidden>
        <div class="preview-head">
          <div>
            <span class="eyebrow">PREVIEW</span>
            <h2 id="fileName">Image</h2>
          </div>
          <button class="text-button" id="resetButton" type="button">Choose another</button>
        </div>
        <div class="canvas-wrap checkerboard">
          <img id="sourcePreview" alt="Selected image preview">
          <img id="resultPreview" alt="Background removed preview" hidden>
        </div>
        <div class="actions">
          <button class="primary" id="removeButton" type="button">Remove background</button>
          <a class="primary download" id="downloadButton" href="#" download hidden>Download PNG</a>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
    </section>

    <footer>
      <span>Local processing</span>
      <span>No account</span>
      <span>No image upload service</span>
    </footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
