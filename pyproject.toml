[project]
name = "kefe-background-removal"
version = "1.2.0"
description = "Cutout — a high-quality self-hosted background removal engine"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4",
  "torchvision",
  "transformers>=4.44",
  "timm",
  "einops",
  "kornia",
  "pillow>=10",
  "numpy>=1.26",
  "scipy>=1.12",
  "huggingface-hub>=0.24",
  "pymatting>=1.1.15",
  "onnxruntime>=1.20",
  "fastapi>=0.139.0",
  "mcp>=2,<3",
  "httpx>=0.28",
  "uvicorn>=0.51.0",
  "python-multipart>=0.0.32"
]

[project.scripts]
cutout = "cutout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cutout"]
